      .luminous-symbols {
        font-family: "Luminous Symbols";
        font-feature-settings: "liga";

        letter-spacing: normal;
        text-transform: none;
        direction: ltr;
        overflow-wrap: normal;
      }

        font-family: "Google Symbols";

      @keyframes willow-dictation-wave {
        0%, 100% { transform: scaleY(0.7); opacity: 0.45; }
        50% { transform: scaleY(var(--wave-scale)); opacity: 0.95; }
      }

      .willow-dictation-bar {
        transform-origin: center;
        animation: willow-dictation-wave 900ms ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .willow-dictation-bar { animation: none; }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              sidebar: "#0f0f0f",
              sidebarHover: "#1f1f1f",
              inputBg: "#27272a",
              "color-1": "hsl(var(--color-1))",
              "color-2": "hsl(var(--color-2))",
              "color-3": "hsl(var(--color-3))",
              "color-4": "hsl(var(--color-4))",
              "color-5": "hsl(var(--color-5))",
            },
            animation: {
              rainbow: "rainbow var(--speed, 2s) infinite linear",
              fadeIn: "fadeIn 150ms ease-out",
              dropdownOpen: "dropdownOpen 200ms cubic-bezier(0.16, 1, 0.3, 1)",
              dropdownClose: "dropdownClose 150ms ease-out forwards",
              dropdownOpenUp: "dropdownOpenUp 200ms cubic-bezier(0.16, 1, 0.3, 1)",
              dropdownCloseUp: "dropdownCloseUp 150ms ease-out forwards",
              shimmer: "shimmer linear infinite",
              textFadeIn: "textFadeIn 800ms ease-out forwards",
              "shimmer-slide": "shimmer-slide var(--speed) ease-in-out infinite alternate",
              "spin-around": "spin-around calc(var(--speed) * 2) infinite linear",
            },
            keyframes: {
              rainbow: {
                "0%": { "background-position": "0%" },
                "100%": { "background-position": "200%" },
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              dropdownOpen: {
                "0%": { opacity: "0", transform: "scale(0.95) translateY(-6px)" },
                "100%": { opacity: "1", transform: "scale(1) translateY(0)" },
              },
              dropdownClose: {
                "0%": { opacity: "1", transform: "scale(1) translateY(0)" },
                "100%": { opacity: "0", transform: "scale(0.95) translateY(-6px)" },
              },
              dropdownOpenUp: {
                "0%": { opacity: "0", transform: "scale(0.95) translateY(6px)" },
                "100%": { opacity: "1", transform: "scale(1) translateY(0)" },
              },
              dropdownCloseUp: {
                "0%": { opacity: "1", transform: "scale(1) translateY(0)" },
                "100%": { opacity: "0", transform: "scale(0.95) translateY(6px)" },
              },
              shimmer: {
                "0%": { "background-position": "100% 0" },
                "100%": { "background-position": "-100% 0" },
              },
              textFadeIn: {
                "0%": { 
                  opacity: "0"
                },
                "100%": { 
                  opacity: "1"
                },
              },
              "spin-around": {
                "0%": {
                  transform: "translateZ(0) rotate(0)",
                },
                "15%, 35%": {
                  transform: "translateZ(0) rotate(90deg)",
                },
                "65%, 85%": {
                  transform: "translateZ(0) rotate(270deg)",
                },
                "100%": {
                  transform: "translateZ(0) rotate(360deg)",
                },
              },
              "shimmer-slide": {
                to: {
                  transform: "translate(calc(100cqw - 100%), 0)",
                },
              },
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(ellipse at center, var(--tw-gradient-stops))',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --color-1: 0 100% 63%;
        --color-2: 270 100% 63%;
        --color-3: 210 100% 63%;
        --color-4: 195 100% 63%;
        --color-5: 90 100% 63%;

        /* shadcn CSS variables for dark theme */
        --background: 0 0% 5%;
        --foreground: 0 0% 100%;
        --card: 0 0% 8%;
        --card-foreground: 0 0% 100%;
        --popover: 0 0% 8%;
        --popover-foreground: 0 0% 100%;
        --primary: 262 83% 58%;
        --primary-foreground: 0 0% 100%;
        --secondary: 0 0% 15%;
        --secondary-foreground: 0 0% 100%;
        --muted: 0 0% 15%;
        --muted-foreground: 0 0% 60%;
        --accent: 0 0% 15%;
        --accent-foreground: 0 0% 100%;
        --destructive: 0 84% 60%;
        --destructive-foreground: 0 0% 100%;
        --border: 0 0% 20%;
        --input: 0 0% 20%;
        --ring: 262 83% 58%;
        --radius: 0.5rem;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #030303;
        color: white;
        overflow: hidden;
      }

      /* Universal Minimal Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 20px;
      }

      /* Custom scrollbar that shows on hover */
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: transparent;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.06);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .gemini-chat-scrollbar {
        scrollbar-color: transparent transparent;
        scrollbar-width: auto;
      }
      .gemini-chat-scrollbar::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      .gemini-chat-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .gemini-chat-scrollbar::-webkit-scrollbar-thumb {
        min-height: 48px;
        border: 2px solid transparent;
        border-radius: 9999px;
        background: transparent;
        background-clip: content-box;
      }
      .gemini-chat-scrollbar:hover {
        scrollbar-color: #333537 transparent;
      }
      .gemini-chat-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: #333537;
      }
      .gemini-chat-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #444746;
      }
      .gemini-chat-scrollbar::-webkit-scrollbar-button {
        width: 0;
        height: 0;
      }

      @media (hover: none), (pointer: coarse) {
        .gemini-user-actions {
          opacity: 1 !important;
          pointer-events: auto !important;
        }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Smooth background transition container */
      .bg-layer {
        position: absolute;
        inset: 0;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes willow-gemini-home-glow-grow {
        0% {
          opacity: 0;
          transform: translate(-50%, -45%) scale(0);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -45%) scale(1);
        }
      }

      .willow-gemini-home-glow::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -45%);
        z-index: -1;
        margin: 0 auto;
        width: 100%;
        max-width: 792px;
        height: 50%;
        max-height: 300px;
        background: radial-gradient(
          ellipse 100% 100% at center 8%,
          rgb(15, 15, 15) 0,
          rgb(6, 78, 59) 50%
        );
        border-radius: 9999px;
        filter: blur(100px);
        pointer-events: none;
        animation: willow-gemini-home-glow-grow 1s cubic-bezier(0.2, 0, 0, 1) both;
      }

      .willow-gemini-home-glow-gray::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -45%);
        z-index: -1;
        margin: 0 auto;
        width: 100%;
        max-width: 792px;
        height: 50%;
        max-height: 300px;
        background: radial-gradient(
          ellipse 100% 100% at center 8%,
          rgb(15, 15, 15) 0,
          rgb(68, 71, 70) 50%
        );
        border-radius: 9999px;
        filter: blur(100px);
        pointer-events: none;
        animation: willow-gemini-home-glow-grow 1s cubic-bezier(0.2, 0, 0, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .willow-gemini-home-glow::before,
        .willow-gemini-home-glow-gray::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
