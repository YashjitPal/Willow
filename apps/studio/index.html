<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willow</title>
    <!--
      NOTHING RENDER-BLOCKING BELONGS IN THIS <head>.

      The first thing on screen is `#willow-boot` at the top of <body> — a static
      copy of the app's own chrome (rail, wordmark, docked composer). It is drawn
      from the inline <style> below and nothing else, so it can paint on the very
      first parse of the document, before a single byte of JS or webfont arrives.

      Two things used to stand in front of it:

      1. `cdn.tailwindcss.com` sat here as a plain parser-blocking <script>, so
         <body> was not even PARSED until it downloaded and ran. It has moved to
         the end of <body>, together with the `tailwind.config` assignment that
         has to follow it. Ordering is unchanged relative to the app: both are
         still classic scripts, and `/src/main.tsx` is a module (deferred), so
         Tailwind is fully initialised before React mounts exactly as before.
      2. The two Google Fonts <link rel="stylesheet"> elements blocked FIRST PAINT
         (stylesheets always do). They now load out of band via the
         `media="print"` swap below, which the parser does not wait on.

      The icon faces the shell actually uses — "Google Sans Flex", "Luminous
      Symbols", "Google Symbols" — are declared as inline @font-face rules in the
      <style> below, so they were never part of that blocking cost.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Auth is the long pole once the bundle has parsed: the session restore and
      the Firestore profile read are two separate cross-origin round trips, and
      the sidebar's account row stays a placeholder until they land. Warming the
      connections here overlaps TLS with bundle download instead of paying for it
      afterwards.
    -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <!--
      `media="print"` makes these non-matching, so the parser downloads them
      without blocking render; `onload` flips them live the moment they arrive.
      The <noscript> copy keeps them blocking-but-present without JS.

      Google Sans Code is requested twice on purpose, because Gemini pins the
      family's MONO axis differently per style and the two cannot be expressed
      in one tuple list:
        • upright keeps the default (monospaced) axis value — this is the face
          code blocks render in, so its URLs must not move;
        • italic pins MONO 0, i.e. *proportional*, and is a genuinely separate
          design rather than a slant of the upright face. Blockquotes and image
          captions are set in it. Without this second request Chrome synthesises
          an oblique from the monospaced upright and the letterforms are visibly
          wrong. `1,0,300..400` reproduces Gemini's own italic file byte for byte.

      Google Sans Text is the body face Gemini and Flow actually set their UI in, and
      several surfaces here already name it first in their font stack — Media's composer,
      the Gems views, the tooltip and dialog stylesheets. It was never loaded, so all of
      them silently fell through to Inter, which has a larger x-height and a taller cap
      height: Flow's placeholder measures 181.26px against Willow's 189.4px for the same
      string at the same declared 14px, and it reads as visibly bigger text.

      Families must be listed alphabetically or the endpoint returns 400.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600;700&family=Google+Sans+Code:ital,MONO,wght@1,0,300..400&family=Google+Sans+Text:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!--
      Noto Color Emoji — the font Google's own emoji keyboard draws from.

      Without it, emoji fall back to the platform font, which on Windows is Segoe UI
      Emoji: a completely different set of artwork, so Willow's notebook glyphs and
      picker never matched Gemini's however correct the layout was. Gemini itself
      goes further and ships sprite IMAGES (the picker's cells measured as having no
      text at all), but Noto is that same artwork as a font, so it matches without an
      asset pipeline.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600;700&family=Google+Sans+Code:ital,MONO,wght@1,0,300..400&family=Google+Sans+Text:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet"
      />
      <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji" rel="stylesheet" />
    </noscript>
    <style>
      @font-face {
        font-family: "Google Sans Flex";
        font-style: oblique 0deg 10deg;
        font-weight: 280 540;
        font-stretch: 92% 100%;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/googlesansflex/v11/t5tQIQcYNIWbFgDgAAzZ34auoVyXkJCOvp3SFWJbN5hF8Ju1x4d-JwN2l9sIKwpINJwakXdYAZzz0jbnDYatsQ.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Luminous Symbols";
        font-style: normal;
        font-weight: 100 700;
        /*
         * `block` here, `swap` would be wrong. These are ICON faces: every glyph
         * is addressed by ligature name ("side_nav_expand", "gemini_chat"), so a
         * fallback render does not show a fallback icon — it shows the literal
         * words "side nav expand" in the sidebar until the font lands, which is
         * far worse than a brief gap where the icon will be.
         *
         * What `block` costs is bounded: a 3s block period, then swap. It is not
         * on the first-paint path either way, because the boot shell below draws
         * its own icons as inline SVG for exactly this reason.
         */
        font-display: block;
        src: url("https://fonts.gstatic.com/l/font?kit=daaDSSYgOGmYaRLpq55MPuzv2kUK2zvmTflyWwG1oySatCZuAYA-8NIsLW680OBb5BBuQa5Dapuzovt2J0psqvrJKUiguriqj38pHhH1_FWVNba9XW1Z0j1SYPtVC_039jdnbiSlMoNYz-sc0l6o2XJnFRZd3LtfgXCEn5sBwOYz9JY-vfCcEZCekq8BFb41oUHJ21PTFnZb2RMMwYCzB7F1mdUaFrYUswpxtQdEmjoEM8p6oWeeN_ktEB1SdkIa-kcux3UrQOn_dQjRWbZcMVX1_RESDzbwHtbyk5rWjbipp7mDJwP4NckVMay3Le8j78DOKTOoejXKXxhX1w78YI4BFD7bbtw99OVHnoVj&skey=bef131c18897d264&v=v38") format("woff2");
      }

      /*
       * Google Symbols, subsetted to the ligatures Willow actually names.
       *
       * The subset is regenerated rather than hand-edited, by
       * `tools/ui-research/scrapers/flow/54-symbols-subset.cjs --add=<new names>`, which works
       * out the current contents by measuring rather than guessing. The full family is 2.8MB;
       * this is 96KB for 194 icons.
       *
       * Adding a glyph means regenerating this URL. There is no fallback for a missing one:
       * a ligature the face does not contain renders as its own name in words, and because
       * the individual letters are present the browser never falls through to another face.
       * `article_spark` in Media's composer was exactly that, arriving as three stray icons.
       *
       * Axes are FILL, ROND and wght — the three `MaterialSymbol` emits for this family.
       * Asking for GRAD or opsz as well makes the endpoint serve TTF instead of woff2.
       */
      @font-face {
        font-family: "Google Symbols";
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url("https://fonts.gstatic.com/l/font?kit=Hhy3U5Ak9u-oMExPeInvcuEmPosC9zS3FYkFU68cPrjdKM1pSPywlmmzc_ohQP9PrWumSDfXZxlcLqnGuwPZJBWrKZK2S-fE6UUzh2RWzVEAcGuQIMHU6OgQWFMwv6w1TNW0QbUB0XTpF8EwYoE4BAqaRWApyCGPE3YKcBsghyt8NVLh4dETuz1qCQpZUlrHmYwelSK7HxjVZM7gJvdXN6P1qwWdwmvsdAKeLJkkXV8Q88WNQ70E_ETQqKkZZebpfaO-iLok9YWXQQFAEd3yGVWEErz4mQT6HwMKUW2MemcalMryuSxZzZmJ2aR3oAY7XYhBQXtZjIqkQSlc-WMHg8kV8HsfXP4-&skey=f8ec4d50247dc1c1&v=v454") format("woff2");
      }

      .material-symbols-rounded,
      .luminous-symbols,
      .google-symbols {
        font-weight: normal;
        font-style: normal;
        letter-spacing: 0;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "liga";
      }

      .material-symbols-rounded {
        font-family: "Material Symbols Rounded";
        font-variation-settings: "FILL" 0, "wght" 320, "GRAD" 0, "opsz" 24;
      }

      /*
        THE LIGATURE FLASH, and why only this family has it.
        Reported as "that icon when it first appears, it appears as a ligature or
        corrupted icon for a few seconds until it's fixed" — `code_blocks` on the
        Canvas card, and the dictation spinner.

        "Luminous Symbols" and "Google Symbols" are declared as inline @font-face
        rules above, with `font-display: block`, so their faces EXIST at first paint
        and the block period keeps the ligature name invisible until the glyph
        arrives. "Material Symbols Rounded" comes from a Google Fonts stylesheet
        that is deliberately non-blocking (`media="print"`, flipped on load), so for
        the first stretch of the page the family is not defined at all — the name
        falls through to the body font and paints as its own letters, which no
        `font-display` can prevent because there is no face yet to apply it to.

        So the text is transparent until a real face reports itself loaded. The
        glyph box is already fixed (`width`/`height` on every MaterialSymbol), so
        nothing moves when it lands; the icon fades up in place. `!important`
        because every call site sets its own colour, and this has to win until the
        script below says otherwise.
      */
      html:not(.willow-icons-ready) .material-symbols-rounded {
        color: transparent !important;
      }
      .material-symbols-rounded {
        transition: color 120ms linear;
      }

      .luminous-symbols {
        font-family: "Luminous Symbols";
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        letter-spacing: normal;
        text-transform: none;
        direction: ltr;
        overflow-wrap: normal;
      }

      .google-symbols {
        font-family: "Google Symbols";
      }

      @keyframes willow-dictation-wave {
        0%, 100% { transform: scaleY(0.7); opacity: 0.45; }
        50% { transform: scaleY(var(--wave-scale)); opacity: 0.95; }
      }

      .willow-dictation-bar {
        transform-origin: center;
        animation: willow-dictation-wave 900ms ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .willow-dictation-bar { animation: none; }
      }

      /* ------------------------------------------------------------------
       * BOOT SHELL
       *
       * Static markup at the top of <body>: a full-width empty surface with
       * the composer docked at the bottom, horizontally centred. No sidebar,
       * no placeholder rows, no shimmer.
       *
       * Why it exists at all: a spinner is drawn BY React, so it cannot appear
       * until the main bundle has been downloaded, parsed and executed — the
       * exact interval it was meant to cover. This is plain HTML with inline
       * CSS, so it paints on the document's first parse and waits on nothing.
       *
       * Why NO SIDEBAR: the app genuinely has no sidebar yet at this point, so
       * drawing one would be a promise the next frame has to keep. The real
       * sequence is the honest one — the surface is full-width with the
       * composer centred across it, then the rail slides in empty, then its
       * rows arrive as their data does. Because the shell reserves no rail
       * width, the composer's centre shifts once when the rail appears; that
       * shift is the app arriving, not a correction of a wrong guess.
       *
       * Why NO SKELETON SHIMMER: a pulsing grey box is the most attention-
       * grabbing thing that can be on a screen where nothing has happened yet.
       * Empty space reads as "not yet"; an animated placeholder reads as
       * "working, and slow". Elements simply appear as they become real.
       *
       * Why the composer starts DOCKED at the bottom: that is the position the
       * box holds in every loaded conversation, so if the session restores into
       * a chat, nothing moves. If it resolves to a new chat instead, the box
       * rises to centre — `ChatView` runs that transition off `isThreadDocked`,
       * so the motion is the app's own, continuing from where the shell left
       * it. Starting centred would mean the more common case began with a
       * downward jump.
       *
       * Dimensions are copied from `Composer.tsx`: max-width 660px, radius
       * 32px, #1e1f21, min-height 64px, 49px of bottom padding. Drift here
       * shows up as a jump at handoff.
       * ------------------------------------------------------------------ */
      #willow-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        background: #0f0f0f;
        /* Icon faces may still be blocked; the shell never waits on them. */
        font-family: "Google Sans Flex", "Google Sans", "Helvetica Neue", -apple-system, sans-serif;
        /* 120ms is short enough to feel like the shell resolving into the app
         * rather than a second screen being dismissed. */
        transition: opacity 120ms cubic-bezier(0.2, 0, 0, 1);
      }

      #willow-boot[data-dismissed="true"] {
        opacity: 0;
        pointer-events: none;
      }

      .willow-boot-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        /* Matches the docked composer's `pb-[49px]`. */
        padding: 0 16px 49px;
        background: #0f0f0f;
      }

      /* An empty box at the composer's exact resting size. It carries the
       * surface colour and the radius and nothing else — no inner bars — so it
       * reads as the composer already being there, unfilled, rather than as a
       * loading graphic. */
      .willow-boot-composer {
        width: 100%;
        max-width: 660px;
        min-height: 64px;
        border-radius: 32px;
        background: #1e1f21;
        box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.16);
      }

      @media (prefers-reduced-motion: reduce) {
        #willow-boot { transition: none; }
      }
    </style>
    <script>
      /*
       * Lifts the icon gate above once "Material Symbols Rounded" can actually
       * draw. See the CSS note for why that family, and only that family, needs it.
       *
       * `document.fonts.check()` is NOT the test: for a family with no @font-face
       * it reports true, because an undefined family is simply skipped and the
       * fallback "can render" the text. And `document.fonts.load()` on the same
       * undefined family resolves immediately with an empty list. Both would report
       * ready during exactly the window this exists to cover — so the real test is
       * whether a FontFace for the family is in the set yet, polled until the
       * deferred stylesheet has added one, then loaded explicitly.
       *
       * Loading it explicitly matters: the glyph text is transparent while we wait,
       * and Chrome will happily start the fetch for transparent text, but driving
       * it from here means the gate cannot deadlock on a paint that never happens.
       *
       * The deadline is a fallback, not the plan: a stylesheet that never arrives
       * leaves the ligature names showing, which is what the app did before this.
       */
      (function () {
        var root = document.documentElement;
        var open = function () { root.classList.add('willow-icons-ready'); };
        if (!document.fonts || !document.fonts.forEach) { open(); return; }
        var FAMILY = 'Material Symbols Rounded';
        var deadline = Date.now() + 10000;
        var tick = function () {
          var faces = [];
          document.fonts.forEach(function (face) { if (face.family === FAMILY) faces.push(face); });
          if (faces.length) {
            Promise.all(faces.map(function (face) {
              return face.status === 'loaded' ? null : face.load().catch(function () {});
            })).then(open, open);
            return;
          }
          if (Date.now() > deadline) { open(); return; }
          setTimeout(tick, 50);
        };
        tick();
      })();
    </script>
    <script>
      /*
       * Held on our own global, then assigned to `tailwind.config` at the end of
       * <body> once the CDN script has run.
       *
       * It cannot be assigned here any more. The Play CDN ends with
       *
       *   window.tailwind = new Proxy({ config: {}, ... }, ...)
       *
       * which is unconditional — it REPLACES the global, so a config set before
       * the script loads is silently discarded and every custom colour, keyframe
       * and animation below reverts to stock Tailwind. Verified against the
       * fetched bundle, not assumed.
       *
       * The same proxy has a `set` trap on `config` that re-runs the compile, so
       * assigning after load is the supported path and costs one extra pass over
       * an empty `#root`. Keeping the object here rather than moving it wholesale
       * keeps this a two-line change to a 100-line literal.
       */
      window.__WILLOW_TW_CONFIG__ = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              sidebar: "#0f0f0f",
              sidebarHover: "#1f1f1f",
              inputBg: "#27272a",
              "color-1": "hsl(var(--color-1))",
              "color-2": "hsl(var(--color-2))",
              "color-3": "hsl(var(--color-3))",
              "color-4": "hsl(var(--color-4))",
              "color-5": "hsl(var(--color-5))",
            },
            animation: {
              rainbow: "rainbow var(--speed, 2s) infinite linear",
              fadeIn: "fadeIn 0.2s ease-out forwards",
              dropdownOpen: "dropdownOpen 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              dropdownClose: "dropdownClose 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              dropdownOpenUp: "dropdownOpenUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              dropdownCloseUp: "dropdownCloseUp 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              shimmer: "shimmer 2s infinite linear",
              textFadeIn: "textFadeIn 0.3s ease-out forwards",
              "spin-around": "spin-around calc(var(--speed) * 2) infinite linear",
              "gemini-dot-bounce": "gemini-dot-bounce 1.4s infinite ease-in-out both",
            },
            keyframes: {
              rainbow: {
                "0%": { "background-position": "0%" },
                "100%": { "background-position": "200%" },
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              dropdownOpen: {
                "0%": { opacity: "0", transform: "scale(0.95) translateY(-6px)" },
                "100%": { opacity: "1", transform: "scale(1) translateY(0)" },
              },
              dropdownClose: {
                "0%": { opacity: "1", transform: "scale(1) translateY(0)" },
                "100%": { opacity: "0", transform: "scale(0.95) translateY(-6px)" },
              },
              dropdownOpenUp: {
                "0%": { opacity: "0", transform: "scale(0.95) translateY(6px)" },
                "100%": { opacity: "1", transform: "scale(1) translateY(0)" },
              },
              dropdownCloseUp: {
                "0%": { opacity: "1", transform: "scale(1) translateY(0)" },
                "100%": { opacity: "0", transform: "scale(0.95) translateY(6px)" },
              },
              shimmer: {
                "0%": { "background-position": "100% 0" },
                "100%": { "background-position": "-100% 0" },
              },
              textFadeIn: {
                "0%": { 
                  opacity: "0"
                },
                "100%": { 
                  opacity: "1"
                },
              },
              "gemini-dot-bounce": {
                "0%, 80%, 100%": { transform: "translateY(0)" },
                "40%": { transform: "translateY(-4px)" }
              },
              "gemini-orbit": {
                "0%": { transform: "rotate(0deg) translateX(4.5px) rotate(0deg)" },
                "100%": { transform: "rotate(360deg) translateX(4.5px) rotate(-360deg)" }
              },
              "spin-around": {
                "0%": {
                  transform: "translateZ(0) rotate(0)",
                },
                "15%, 35%": {
                  transform: "translateZ(0) rotate(90deg)",
                },
                "65%, 85%": {
                  transform: "translateZ(0) rotate(270deg)",
                },
                "100%": {
                  transform: "translateZ(0) rotate(360deg)",
                },
              },
              "shimmer-slide": {
                to: {
                  transform: "translate(calc(100cqw - 100%), 0)",
                },
              },
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(ellipse at center, var(--tw-gradient-stops))',
            },
          },
        },
      };
    </script>
    <style>

      /*

          background: content-box transparent;
          border: 2px solid transparent;
          border-radius: 9999px;
          min-height: 48px;
          min-width: 48px;
        }
        
        /* Show scrollbar when hovering over the container */
        .gemini-chat-scrollbar:hover::-webkit-scrollbar-thumb {
          background: content-box rgb(51, 53, 55);
        }
        
        /* Brighten scrollbar when interacting directly with it */
        .gemini-chat-scrollbar::-webkit-scrollbar-thumb:active,
        .gemini-chat-scrollbar::-webkit-scrollbar-thumb:hover {
          background: content-box rgb(68, 71, 70);
        }
        
        .gemini-chat-scrollbar::-webkit-scrollbar-button {
          height: 0px;
          width: 0px;
        }
      }

      /* Fallback for non-webkit browsers */
      @supports not (selector(::-webkit-scrollbar)) {
        .gemini-chat-scrollbar {
          scrollbar-color: transparent transparent;
          scrollbar-width: thin;
        }
        .gemini-chat-scrollbar:hover {
          scrollbar-color: rgb(51, 53, 55) transparent;
        }
      }

      /*
       * The prompt's Copy / Edit row reveals on hover, and on KEYBOARD focus —
       * never on a plain click.
       *
       * The row carried Tailwind's `group-focus-within:` variant, which matches
       * `:focus`. Clicking a <button> focuses it, so pressing Copy left the row
       * pinned open until the user clicked somewhere else. `:focus-visible` is
       * the distinction that was missing: Chrome does not match it for a mouse
       * click on a button, but does for Tab — so tabbing into the row (which is
       * `opacity-0` at rest) still reveals it.
       *
       * Higher specificity than Tailwind's `.opacity-0` / `.pointer-events-none`
       * utilities, so source order between this block and the CDN's injected
       * sheet does not matter.
       */
      .gemini-user-actions:has(:focus-visible) {
        opacity: 1;
        pointer-events: auto;
      }

      @media (hover: none), (pointer: coarse) {
        .gemini-user-actions {
          opacity: 1 !important;
          pointer-events: auto !important;
        }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Smooth background transition container */
      .bg-layer {
        position: absolute;
        inset: 0;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes willow-gemini-home-glow-grow {
        0% {
          opacity: 0;
          transform: translate(-50%, -45%) scale(0);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -45%) scale(1);
        }
      }

      @keyframes spark-home-glow-grow {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /*
       * The accent stop is Gemini's `--lumi-sys-color--surface-accent`, the one
       * token its own rule references. Willow drives it from the workspace
       * colour: `MediaHome` sets `--willow-home-glow-accent` on the host, and
       * the fallback here is the shipped green, so the glow still paints if the
       * profile has not loaded yet. Blue resolves to Gemini's measured
       * `#14204f` = rgb(20, 32, 79). See `features/media/src/home-glow.ts`.
       */
      .willow-gemini-home-glow::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -45%);
        z-index: -1;
        margin: 0 auto;
        width: 100%;
        max-width: 792px;
        height: 50%;
        max-height: 300px;
        background: radial-gradient(
          ellipse 100% 100% at center 8%,
          rgb(15, 15, 15) 0,
          var(--willow-home-glow-accent, rgb(6, 78, 59)) 50%
        );
        border-radius: 9999px;
        filter: blur(100px);
        pointer-events: none;
        animation: willow-gemini-home-glow-grow 1s cubic-bezier(0.2, 0, 0, 1) both;
      }

      /*
       * Temporary-chat variant. A MODIFIER on the glow, never a replacement for
       * it: the box, the blur and the grow animation are shared, and only the
       * gradient's outer stop changes. That is how Gemini does it
       * (`.show-lm-background.is-temporary-chat::before` overrides `background`
       * alone), and the sharing is what makes toggling look right — a separate
       * class would be a different `::before` rule, so every toggle would
       * restart `grow` and visibly collapse the glow to scale(0) before
       * regrowing it. Gemini's own capture shows `lm-background-grow` firing
       * only on load and New chat, never on a toggle.
       *
       * The colour is Gemini's `--gem-sys-color--outline-variant` (#444746)
       * against `--lumi-sys-color--surface` (#0f0f0f) — the same opaque radial
       * as normal mode, not a translucent white haze.
       *
       * It is deliberately a literal, not `--willow-home-glow-accent`: Gemini's
       * `is-temporary-chat` replaces the accent stop outright, so temporary
       * chat is the same neutral gray at every workspace colour.
       */
      .willow-gemini-home-glow.willow-gemini-home-glow-gray::before {
        background: radial-gradient(
          ellipse 100% 100% at center 8%,
          rgb(15, 15, 15) 0,
          rgb(68, 71, 70) 50%
        );
      }

      @media (prefers-reduced-motion: reduce) {
        .willow-gemini-home-glow::before,
        .willow-gemini-home-glow-gray::before {
          animation: none;
        }
      }

      /*
       * Gemini's `_lm-fade-in-up`, measured off the live app rather than eyeballed.
       * One animation drives both the normal greeting and the temporary-chat
       * card; they differ only in `--willow-fade-in-up-delay`, which is why the
       * card leads and the heading follows it by 250ms.
       */
      @keyframes willow-lm-fade-in-up {
        0% {
          opacity: 0;
          transform: translateY(40px);
        }
        100% {
          opacity: 1;
          transform: translateY(0px);
        }
      }

      .willow-lm-fade-in-up {
        opacity: 0;
        animation: willow-lm-fade-in-up 0.3s cubic-bezier(0.2, 0, 0, 1)
          var(--willow-fade-in-up-delay, 0s) forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .willow-lm-fade-in-up {
          animation-duration: 0.01ms;
          animation-delay: 0s;
        }
      }

      /* Gemini Mic Click Ripple Effect */
      @keyframes geminiMicRipple {
        0% {
          transform: scale(0.2);
          opacity: 0.8;
        }
        100% {
          transform: scale(2.4);
          opacity: 0;
        }
      }

      .gemini-mic-ripple-effect {
        position: absolute;
        inset: 0px;
        border-radius: 50%;
        background-color: rgba(227, 227, 227, 0.15);
        pointer-events: none;
        animation: geminiMicRipple 0.35s cubic-bezier(0.2, 0, 0, 1) forwards;
      }

      @keyframes willow-composer-send-enter {
        0% {
          opacity: 0;
          animation-timing-function: linear;
        }
        20% {
          opacity: 0;
          animation-timing-function: cubic-bezier(0.2, 0, 0, 1);
        }
        100% {
          opacity: 1;
        }
      }

      .willow-composer-send-enter {
        animation: willow-composer-send-enter 250ms linear both;
      }

      ::selection {
        background-color: var(--studio-selection-bg, rgba(156, 228, 179, 0.35));
      }
      ::-moz-selection {
        background-color: var(--studio-selection-bg, rgba(156, 228, 179, 0.35));
      }

      /* Disallow text selection on placeholder hints & zero-state static headings */
      ::placeholder,
      ::-webkit-input-placeholder,
      ::-moz-placeholder,
      :-ms-input-placeholder {
        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
      }

      /* Gemini-style speech dictation butterfly waveform */
      .willow-butterfly-wave-view {
        --willow-dictation-wave-color: #e0e0e0;
        display: flex;
        width: 100%;
        height: 24px;
        align-items: center;
        justify-content: center;
        opacity: 1;
      }

      .willow-butterfly-wave-view.entering-dictation {
        transition: opacity 0.25s linear 0.1s;
      }

      @starting-style {
        .willow-butterfly-wave-view.entering-dictation {
          opacity: 0;
        }
      }

      .willow-butterfly-wave-canvas {
        display: block;
      }

      /* Gemini Post-Dictation Text Placement Transition */
      .textarea-wrapper.exiting-dictation {
        transition: opacity 0.25s linear 0.1s;
      }
      @starting-style {
        .textarea-wrapper.exiting-dictation {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!--
      First paint. See the BOOT SHELL block in <head> for why this is static
      HTML rather than something React draws, why there is no sidebar and no
      shimmer, and why the composer starts docked. `#root` mounts underneath it
      and the shell fades out from `main.tsx` once React has actually painted a
      frame.

      `aria-hidden` + `inert`: this is decoration standing in for UI that does
      not exist yet, so it must not be reachable by a screen reader or by Tab.
      The `<div role="status">` carries the only thing worth announcing.
    -->
    <div id="willow-boot" aria-hidden="true" inert>
      <div class="willow-boot-main">
        <div class="willow-boot-composer"></div>
      </div>
    </div>
    <div class="sr-only" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Loading Willow</div>

    <div id="root"></div>

    <!--
      Moved out of <head>: as a plain classic script it blocks the parser, and in
      <head> that meant nothing above could paint. Down here everything above has
      already been parsed and painted, and it still runs before `/src/main.tsx`
      (a module, therefore deferred), so React continues to mount into a fully
      configured Tailwind exactly as it did before.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Must follow the CDN script — it replaces `window.tailwind` wholesale.
      // See the note on `__WILLOW_TW_CONFIG__` in <head>.
      tailwind.config = window.__WILLOW_TW_CONFIG__;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
